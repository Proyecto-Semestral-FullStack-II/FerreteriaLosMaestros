<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Ferretería Los Maestros</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #c5caa3;
            padding-top: 130px;
            font-family: Arial, sans-serif;
        }

        /* BARRA DE NAVEGACIÓN */
        nav {
            background-color: #272a18;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100000;
            padding: 15px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .logo a {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            margin-left: 20px;
        }

        .logo-icon {
            height: 45px;
            width: auto;
        }

        .logo-text {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .menu-enlaces {
            display: flex;
            list-style: none;
            margin-left: 20px;
        }

        .menu-enlaces a {
            text-decoration: none;
            color: white;
            font-size: 15px;
            padding: 8px 12px;
            transition: background-color 0.2s;
        }

        .menu-enlaces a:hover {
            background-color: #5c6138;
            border-radius: 5px;
        }

        /* USER ACTIONS Y CARRITO */
        .user-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
            margin-right: 25px;
        }

        .user-dropdown { position: relative; }

        .user-trigger {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 10;
            border-radius: 4px;
            top: 100%;
            right: 0;
        }

        .dropdown-content a {
            color: #333;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
            color: #5c6138;
        }

        .user-dropdown:hover .dropdown-content { display: block; }

        .cart-link {
            position: relative;
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            left: -12px;
            background-color: #cc0000;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
        }

        /* BUSCADOR */
        .search-container {
            display: flex;
            justify-content: center;
            padding: 10px 0 25px 0;
            width: 100%;
        }

        .search-container form { display: flex; }

        .search-input {
            width: 400px;
            padding: 10px 15px;
            border: 1px solid #a4a982;
            border-radius: 4px 0 0 4px;
            outline: none;
            font-size: 15px;
        }

        .search-button {
            padding: 10px 20px;
            background-color: #5c6138;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .search-button:hover { background-color: #3b3f24; }

        /* GRILLA */
        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
        }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px 20px;
        }

        .card-producto {
            display: flex;
            flex-direction: column;
            background-color: transparent;
        }

        .card-imagen-box {
            width: 100%;
            height: 160px;
            border: 1.5px solid #000;
            background-color: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-imagen-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-cuerpo {
            background-color: #dcdfc3;
            border: 1.5px solid #000;
            border-top: none;
            padding: 12px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
        }

        .card-titulo {
            color: #0033cc;
            text-decoration: underline;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .card-precio {
            font-size: 14px;
            font-weight: bold;
            color: #000;
        }

        .btn-anadir {
            background-color: #fff;
            border: 1.5px solid #000;
            border-radius: 4px;
            padding: 3px 18px;
            font-size: 13px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.2s;
        }

        .btn-anadir:hover:not(:disabled) {
            background-color: #272a18;
            color: #fff;
        }

        .btn-anadir:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 992px) { .productos-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .productos-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .productos-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>

    <nav class="navbar-ferreteria">
        <div class="logo">
            <a href="index.html">
                <img src="montain.jfif" alt="Icono de montaña" class="logo-icon">
                <span class="logo-text">Ferreteria Los Maestros</span>
            </a>
        </div>

        <ul class="menu-enlaces">
            <li><a href="index.html">Home</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="blogs.html">Blogs</a></li>
            <li><a href="contacto.html">Contactanos</a></li>
        </ul>

        <div class="user-actions">
            <div class="user-dropdown">
                <a href="#" class="user-trigger">👤 Bienvenido</a>
                <div class="dropdown-content">
                    <a href="registro.html">Registrarse</a>
                    <a href="login.html">Iniciar sesión</a>
                </div>
            </div>

            <a href="carrito.html" class="cart-link">
                <span class="cart-badge" id="cartBadge">0</span>
                🛒 Carrito
            </a>
        </div>
    </nav>

    <div class="search-container">
        <form id="searchForm">
            <input type="text" id="searchInput" class="search-input" placeholder="¿Qué estás buscando?">
            <button type="submit" class="search-button">Buscar</button>
        </form>
    </div>

    <main class="main-container">
        <div class="productos-grid" id="contenedorProductos"></div>
    </main>

    <script src="jsProducto/productos.js"></script>

    
</body>
</html>
