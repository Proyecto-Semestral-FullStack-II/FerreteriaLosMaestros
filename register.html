    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/styles.css">

</head>
<body>
    <div>
        <nav class="navbar-ferreteria">

                <a href="index.html">
                    <img src="images/montain.jfif" alt="Icono de montañas" class="logo-icon">
                    <span class="logo-text"> Ferreteria Los Maestros</span>

            <ul class="menu-enlaces">
                <li><a href="index.html">Home</a></li>

            </ul>
            <!-- Cierre de tu lista de enlaces actual -->
            </ul>
            <!-- NUEVO: Contenedor de Acciones de Usuario (Lado Derecho) -->
            <div class="user-actions">
                <!-- 1. El menú desplegable de "Bienvenido" -->
                <div class="user-dropdown">
                    <a href="#" class="user-trigger">
                        👤 Bienvenido
                    </a>
                    <!-- La caja blanca que estará oculta -->
                    <div class="dropdown-content">
                        <a href="register.html">Registrarse</a>

                <!-- 2. El botón del Carrito de Compras -->

                    🛒 Carrito

            </div>

    </div>
    <br><br><br><br>
    <div>
        <main class="register-wrapper"> <!--Identificador solo para la tarjeta de registro-->
            <div class="register-container">
                <div class="register-header">
                    <h2>Registro de Usuario</h2>
                    <p>Ingrese sus credenciales para continuar</p>
                </div>
                <form action="#" method="POST" class="register-form">
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <input type="text" id="name" name="name" placeholder="Juan Perez" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="password-2">Confirmar Contraseña</label>
                        <input type="password" id="password-2" name="password-2" placeholder="••••••••" required>
                        <span id="error-message" class="error-text">Las contraseñas no coinciden</span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Telefono</label>
                        <input type="tel" id="phone" name="phone" placeholder="9XXXXXXXX"
                               maxlength="9"
                               pattern="[0-9]{F9}"
                               title="Debe ingresar exactamente 9 numeros"
                               oninput="this.value=this.value.replace(/[^0-9]/g,'')" required><!--Ingreso solo de numeros-->
                    </div>
                    <div class="form-group">
                        <label for="region">Regíon:</label>
                        <select id="region" name="region" required> <!--Combo box de Las Regiones-->
                            <option value="" disabled selected>---Seleccione una región---</option>
                            <option value="arica-parinacota">Región de Arica y Parinacota</option>
                            <option value="tarapaca">Región de Tarapacá</option>
                            <option value="antofagasta">Región de Antofagasta</option>
                            <option value="atacama">Región de Atacama</option>
                            <option value="coquimbo">Región de Coquimbo</option>
                            <option value="valparaiso">Región de Valparaíso</option>
                            <option value="metropolitana">Región Metropolitana de Santiago</option>
                            <option value="ohiggins">Región del Libertador General Bernardo O'Higgins</option>
                            <option value="maule">Región del Maule</option>
                            <option value="nuble">Región de Ñuble</option>
                            <option value="biobio">Región del Biobío</option>
                            <option value="araucania">Región de La Araucanía</option>
                            <option value="los-rios">Región de Los Ríos</option>
                            <option value="los-lagos">Región de Los Lagos</option>
                            <option value="aysen">Región Aysén del General Carlos Ibáñez del Campo</option>
                            <option value="magallanes">Región de Magallanes y de la Antártica Chilena</option>
                        </select>
                        <br><br>
                        <!--Combo box de Las Comunas-->
                        <label for="comuna">Comuna:</label>
                        <select name="comuna" id="comuna" disabled>
                            <option value="" disabled selected>---Seleccione una Comuna---</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-login">Registrarse</button>
                </form>
                <!--<div class="login-footer">
                    <p>¿No tienes una cuenta?<a href="register.html">Registrate aqui</a></p>
                </div>-->
                <script src="js/script.js"></script>
            </div>
        </main>
    </div>
</body>
</html>
