<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LosMaestros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="images/montain.jfif">
</head>
<body>
    <div>
        <nav class="navbar-ferreteria">
            <div class="logo">
                <a href="index.html">
                    <img src="images/montain.jfif" alt="Icono de montañas" class="logo-icon">
                    <span class="logo-text"> Ferreteria Los Maestros</span>
                </a>
            </div>
            <ul class="menu-enlaces">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contactanos</a></li>

            </ul>
            <!-- Cierre de tu lista de enlaces actual -->
            </ul>
            <!-- NUEVO: Contenedor de Acciones de Usuario (Lado Derecho) -->
            <div class="user-actions">
                <!-- 1. El menú desplegable de "Bienvenido" -->
                <div class="user-dropdown">
                    <a href="#" class="user-trigger">
                        👤 Bienvenido
                    </a>
                    <!-- La caja blanca que estará oculta -->
                    <div class="dropdown-content">
                        <a href="register.html">Registrarse</a>
                        <a href="login.html">Iniciar sesión</a>
                    </div>
                </div>
                <!-- 2. El botón del Carrito de Compras -->
                <a href="carrito.html" class="cart-link">
                    <span class="cart-badge">0</span>
                    🛒 Carrito
                </a>
            </div>
        </nav>
    </div>
    <br><br><br><br>
    <div>
        <main class="login-wrapper"><!--Identificador solo para la tarjeta de login-->
            <div class="login-container">
                <div class="login-header">
                    <h2>Bienvenido</h2>
                    <p>Ingrese sus credenciales para continuar</p>
                </div>
                <form action="#" method="POST" class="login-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember-me">Recordarme
                        </label>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                </form>

                <div class="login-footer">
                    <p>¿No tienes una cuenta?<a href="register.html">Registrate aqui</a></p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
